name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    permissions:
      contents: read
      packages: write
    uses: hng011/nyehrver/.github/workflows/deploy.yaml@main
    with:
      namespace: my-bot-liar
      name: bot-liar
      port: 8000
      replicas: 1
      env_secret: bot-liar-env
      seal_env: true
      memory_limit: 1Gi
    secrets:
      SEALED_SECRETS_CERT: ${{ secrets.SEALED_SECRETS_CERT }}
      INFRA_TOKEN: ${{ secrets.INFRA_TOKEN }}
      ADMIN_USER: ${{ secrets.ADMIN_USER }}
      ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      ALLOW_DM: ${{ secrets.ALLOW_DM }}
