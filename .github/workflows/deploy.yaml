name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    permissions:
      contents: read
      packages: write
    uses: hng011/nyehrver/.github/workflows/deploy.yaml@main
    with:
      namespace: my-bot-liar
      name: bot-liar
      port: 8000
      replicas: 1
      env_secret: bot-liar-env
      seal_env: true
      memory_limit: 1Gi
      persistence_size: 1Gi
      tcp_probe: true
    secrets:
      SEALED_SECRETS_CERT: ${{ secrets.SEALED_SECRETS_CERT }}
      INFRA_TOKEN: ${{ secrets.INFRA_TOKEN }}
      # Whole bot-liar .env (KEY=value lines, no quotes)
      ENV_FILE: ${{ secrets.ENV_FILE }}
